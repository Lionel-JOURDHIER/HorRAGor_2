[project]
name = "database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.14.2",
    "fastapi>=0.136.3",
    "langchain-ollama>=1.1.0",
    "loguru>=0.7.3",
    "pgvector>=0.4.2",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg2>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.coverage.report]
# Dit à coverage d'ignorer les blocs d'exécution directe
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:"
]

[tool.setuptools]
package-dir = {"" = "."}
packages = ["database", "shared"]

[tool.ruff]
# "*.md" : ruff formate aussi les blocs de code Python contenus dans les
# fichiers Markdown. Sans cette exclusion, `ruff format` réécrit les
# exemples des README, qui sont de la documentation et pas du code exécuté.
extend-exclude = ["*.md"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# D (docstrings) volontairement omis pour l'instant : le code existant n'a
# pas encore été mis à niveau, l'activer ferait échouer le hook pre-commit
# sur la quasi-totalité des fichiers. À ajouter une fois une passe de mise
# en conformité des docstrings faite séparément.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# queries.py insère la racine du dépôt dans sys.path avant d'importer
# shared.* et database.* : ces imports doivent donc rester après ce code,
# ce que E402 signale à tort comme un défaut d'ordre.
"queries.py" = ["E402"]
