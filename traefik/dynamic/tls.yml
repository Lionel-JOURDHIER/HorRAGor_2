# traefik/dynamic/tls.yml
# Configuration dynamique du provider `file` : déclare le certificat TLS de
# développement comme certificat par défaut, à la place de celui que Traefik
# génère sinon lui-même à chaque démarrage. Les fichiers référencés
# (traefik/certs/) sont générés localement par scripts/generate-traefik-cert.sh
# et ne sont pas commités — un certificat n'appartient à aucun conteneur,
# c'est ce provider qui porte sa configuration (voir rules/deploiement.md).
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/localhost.crt
        keyFile: /etc/traefik/certs/localhost.key
