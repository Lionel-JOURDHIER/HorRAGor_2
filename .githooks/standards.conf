# Configuration du hook pre-commit — à copier en .githooks/standards.conf
# Fichier shell simple, sourcé par le hook. Versionné avec le dépôt.
# Le chemin .githooks/standards.conf est en dur dans le hook : rangé ailleurs,
# ce fichier est ignoré sans message et plus rien n'est vérifié.

# bloquer | avertir
MODE=bloquer

# Branches sur lesquelles un commit direct est refusé.
BRANCHES_PROTEGEES="main master"

# Chemins ignorés par toutes les vérifications (motifs glob, séparés par un espace).
CHEMINS_EXCLUS="Reference/* donnees/*"

# Fichiers qui ne doivent jamais entrer dans le dépôt.
MOTIFS_INTERDITS="sources/* *.xlsx config.json .env"

# Python
INTERDIRE_PRINT=0        # 1 si le projet a un logger
INTERDIRE_LOGGING=0      # 1 si le projet utilise loguru
MODULE_LOGGER=""         # ex. logger.py — seul endroit où logger.add() est permis
RUFF=0                   # 1 si ruff est une dépendance de dev

# JavaScript
BIOME_DOSSIER=""         # ex. app — vide pour désactiver


# ---------------------------------------------------------------------------
# Exemples réels
# ---------------------------------------------------------------------------
#
# Projet pywebview (loguru, ruff, Biome) :
#   MODE=bloquer
#   CHEMINS_EXCLUS="Reference/*"
#   MOTIFS_INTERDITS="*.pdf *.dwg .env"
#   INTERDIRE_PRINT=1
#   INTERDIRE_LOGGING=1
#   MODULE_LOGGER="logger.py"
#   RUFF=1
#   BIOME_DOSSIER="app"
#
# Suivi VALOPHIS (print() est le mécanisme de suivi voulu, pas de ruff) :
#   MODE=bloquer
#   MOTIFS_INTERDITS="sources/* *.xlsx config.json"
#   INTERDIRE_PRINT=0
#   RUFF=0
#
# Outil VBA (rien à linter, mais des données clients à retenir) :
#   MODE=bloquer
#   MOTIFS_INTERDITS="*.xlsx exports/*"
#
# Une ligne print() volontaire dans un projet où c'est interdit se marque :
#   print(resultat)  # standards: print autorise
