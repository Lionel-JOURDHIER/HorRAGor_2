[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain>=1.3.4",
    "langchain-core>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.4",
    "langfuse>=3.0.0",
    "loguru>=0.7.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.3.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "faiss-cpu>=1.15.0",
    "pgvector>=0.5.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite>=0.22.1",
    "psycopg2>=2.9.12",
    "furo>=2025.12.19",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "myst-parser>=5.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "sphinx<9",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "database*", "agents*", "shared*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# D (docstrings) volontairement omis pour l'instant : le code existant n'a
# pas encore été mis à niveau, l'activer ferait échouer le hook pre-commit
# sur la quasi-totalité des fichiers. À ajouter une fois une passe de mise
# en conformité des docstrings faite séparément.
select = ["E", "W", "F", "I"]
