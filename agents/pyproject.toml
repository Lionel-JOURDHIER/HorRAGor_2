[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.14.2",
    "langchain-core>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.4",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "loguru>=0.7.3",
    "pgvector>=0.4.2",
    "psycopg2>=2.9.12",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.0.50",
]

[tool.setuptools]
package-dir = {"" = "."}
packages = ["database", "agents", "api", "frontend"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.coverage.report]
# Dit à coverage d'ignorer les blocs d'exécution directe
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:"
]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# D (docstrings) volontairement omis pour l'instant : le code existant n'a
# pas encore été mis à niveau, l'activer ferait échouer le hook pre-commit
# sur la quasi-totalité des fichiers. À ajouter une fois une passe de mise
# en conformité des docstrings faite séparément.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# graph.py insère la racine du dépôt dans sys.path avant ses imports locaux
# (agents.*, shared.*) : ces imports doivent donc rester après ce code, ce
# que E402 signale à tort comme un défaut d'ordre.
"graph.py" = ["E402"]
