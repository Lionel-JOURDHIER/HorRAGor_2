[theme]
# Couleurs principales de l'univers "HorRAGor - Chat Horror"
# Rouge sang pour les boutons et les éléments actifs
primaryColor = "#8b0000"          
# Noir profond pour l'arrière-plan de l'application
backgroundColor = "#111111"       
# Gris très sombre pour la barre latérale et les bulles de chat
secondaryBackgroundColor = "#1b1f24" 
# Blanc cassé / Gris clair pour une lecture confortable
textColor = "#e2e8f0"              
font = "sans serif"

[server]
# Streamlit tourne derrière Traefik (voir docker-compose.yml) : il n'écoute
# jamais directement sur une interface publique, mais l'exposition n'est qu'une
# partie du problème.
headless = true
port = 8501

# --- Contrôle de l'origine (le point que Traefik ne peut PAS couvrir) --------
# L'ancienne valeur `enableCORS = false` faisait envoyer
# `Access-Control-Allow-Origin: *` et, surtout, faisait accepter une connexion
# WebSocket depuis n'importe quelle origine. `enableXsrfProtection` n'y changeait
# rien : ouvrir un WebSocket ne réclame pas de jeton XSRF.
#
# Et la règle `Host(...)` de Traefik ne suffit pas non plus : dans une attaque
# cross-origin, le navigateur de la victime envoie bien `Host: localhost`
# (puisqu'il se connecte à cette app) — c'est l'en-tête `Origin` qui trahit le
# site attaquant, et Traefik v3 n'a pas de middleware pour le filtrer.
enableCORS = true
enableXsrfProtection = true

# Schéma, hôte et port doivent correspondre EXACTEMENT à ce que voit le
# navigateur, donc l'URL Traefik — jamais http://localhost:8501, qui n'est plus
# publié. Le port n'est implicite que s'il vaut 80 ; Traefik publiant 8088 (voir
# docker-compose.yml), il s'écrit. C'est CETTE ligne qui bloque le WebSocket
# venu d'une autre origine, et elle ne dépend pas du TLS : passer la stack en
# clair ne l'affaiblit pas. Ajouter ici le domaine de production le jour venu —
# en https, cette fois.
corsAllowedOrigins = ["http://localhost:8088"]


[browser]
# Adresse par laquelle le navigateur atteint l'app (via Traefik), utilisée par
# Streamlit pour construire ses URL et vérifier l'origine. Doit suivre le port
# publié dans docker-compose.yml.
serverAddress = "localhost"
serverPort = 8088
# Coupe l'envoi de statistiques d'usage à Streamlit.
gatherUsageStats = false
