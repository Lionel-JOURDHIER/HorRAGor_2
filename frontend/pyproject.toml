[project]
name = "frontend"
version = "0.1.0"
description = "Interface Streamlit pour HorRAGor - Chatbot d'horreur avec ReAct Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --disable-warnings"
markers = [
    "integration: tests d'intégration avec API réelle (nécessite --run-integration)",
]

[tool.ruff]
# "*.md" : ruff formate aussi les blocs de code Python contenus dans les
# fichiers Markdown. Sans cette exclusion, `ruff format` réécrit les
# exemples des README, qui sont de la documentation et pas du code exécuté.
extend-exclude = ["*.md"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# D (docstrings) volontairement omis pour l'instant : le code existant n'a
# pas encore été mis à niveau, l'activer ferait échouer le hook pre-commit
# sur la quasi-totalité des fichiers. À ajouter une fois une passe de mise
# en conformité des docstrings faite séparément.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# E501 : les lignes trop longues restantes sont des blocs CSS/HTML injectés
# via st.markdown(unsafe_allow_html=True), pas du code Python. Les replier
# reviendrait à réécrire la feuille de style dans une passe de lint.
"app.py" = ["E501"]
"components/components.py" = ["E501"]
"components/auth_components.py" = ["E501"]
