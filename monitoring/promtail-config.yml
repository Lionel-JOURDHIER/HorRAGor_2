server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: horragor_api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/horragor_api'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - target_label: service
        replacement: horragor_api


  - job_name: horragor_database_api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/horragor_database_api'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - target_label: service
        replacement: horragor_database_api